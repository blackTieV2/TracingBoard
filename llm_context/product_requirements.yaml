schema_version: "1.0"
document_id: "tb-product-requirements"
phase: "TB-1"
last_updated: "2026-05-13"

product_goal:
  primary: "Create a sustainable Masonic learning and discussion platform."
  secondary: "Revive the spirit of the former printed Tracing Board periodical in a modern online form."

mvp_scope:
  public_site:
    required:
      - id: "PUB-001"
        name: "Home page"
        intent: "Explain Tracing Board and route visitors to papers, learning pathways, submissions, and community."
      - id: "PUB-002"
        name: "About page"
        intent: "Explain history, purpose, operating model, and relationship to the District if approved."
      - id: "PUB-003"
        name: "Papers landing page"
        intent: "Present featured and recent Masonic papers with links to discussion."
      - id: "PUB-004"
        name: "Learning pathways page"
        intent: "Guide newer and experienced Brethren to appropriate content."
      - id: "PUB-005"
        name: "Questions bridge page"
        intent: "Encourage questions and route them to community.tracingboard.org."
      - id: "PUB-006"
        name: "Committees page"
        intent: "Provide space for District committee learning-related visibility."
      - id: "PUB-007"
        name: "Submit page"
        intent: "Explain how to submit papers, questions, resources, and updates."
      - id: "PUB-008"
        name: "Community bridge page"
        intent: "Explain why and how to join the Discourse community."
      - id: "PUB-009"
        name: "Contact page"
        intent: "Provide editorial, technical, and moderation contact routes."
  community:
    required:
      - id: "COM-001"
        name: "Member registration"
        platform: "Discourse"
      - id: "COM-002"
        name: "Categories"
        platform: "Discourse"
      - id: "COM-003"
        name: "Papers and replies"
        platform: "Discourse"
      - id: "COM-004"
        name: "Question posting"
        platform: "Discourse"
      - id: "COM-005"
        name: "Moderation queue"
        platform: "Discourse"
      - id: "COM-006"
        name: "Email notifications and digests"
        platform: "Discourse"
      - id: "COM-007"
        name: "Trust levels"
        platform: "Discourse"
      - id: "COM-008"
        name: "Private moderator category"
        platform: "Discourse"

non_goals_for_mvp:
  - "Custom forum engine"
  - "Custom authentication system"
  - "Paid membership"
  - "Certificate issuing"
  - "Full LMS"
  - "Anonymous posting"
  - "Mobile app"
  - "Complex committee workflow engine"
  - "Home-lab production hosting"
  - "Unrestricted public ritual discussion"
  - "Replacement for official District website"

functional_requirements:
  - id: "FR-001"
    requirement: "Visitors can understand what Tracing Board is within 10 seconds of landing on the home page."
  - id: "FR-002"
    requirement: "Visitors can reach community.tracingboard.org from the public site within one click from the home page."
  - id: "FR-003"
    requirement: "Members can submit or learn how to submit a paper."
  - id: "FR-004"
    requirement: "Members can ask questions in a dedicated Q&A-style area."
  - id: "FR-005"
    requirement: "Papers can have associated discussion threads."
  - id: "FR-006"
    requirement: "Moderators can approve, move, edit, hide, or respond to problematic content."
  - id: "FR-007"
    requirement: "The platform can support committee-specific areas without overloading the first release."
  - id: "FR-008"
    requirement: "Email notifications and digests can draw inactive members back into the platform."

quality_attributes:
  usability:
    - "Clear navigation"
    - "Readable typography"
    - "Mobile-responsive layout"
    - "Low-friction path to joining community"
  credibility:
    - "Avoid sensational language"
    - "Avoid unsupported historical certainty"
    - "Distinguish allegory, tradition, interpretation, and evidence"
  maintainability:
    - "Use structured context files"
    - "Keep GitHub as source of truth"
    - "Avoid custom code where proven platforms exist"
  security:
    - "No secrets in repository"
    - "No home-lab public exposure for MVP"
    - "Use managed DNS and mature forum controls"

launch_stages:
  - stage: "Private build"
    goals:
      - "LLM context pack"
      - "Architecture decisions"
      - "Public site prototype"
      - "Discourse model"
  - stage: "Soft launch"
    target_users: "10-20 trusted Brethren"
    goals:
      - "Validate login"
      - "Validate posting"
      - "Validate moderation"
      - "Validate email"
      - "Validate tone"
  - stage: "Controlled District launch"
    target_users: "Lodge education officers, preceptors, committee members, interested Brethren"
    goals:
      - "Build content rhythm"
      - "Seed discussion"
      - "Invite contributors"
  - stage: "Sustained operation"
    goals:
      - "Monthly featured paper"
      - "Weekly question"
      - "Committee updates"
      - "Digest cycle"
