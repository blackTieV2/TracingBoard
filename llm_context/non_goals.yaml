schema_version: "1.0"
document_id: "tb-non-goals"
phase: "TB-1"
last_updated: "2026-05-13"

non_goals:
  mvp:
    - id: "NG-001"
      item: "Custom forum"
      reason: "Mature community functions should be handled by Discourse."
    - id: "NG-002"
      item: "Custom authentication"
      reason: "Avoid unnecessary security and maintenance risk."
    - id: "NG-003"
      item: "Home-lab production hosting"
      reason: "Public exposure, uptime, and security risk are not justified for MVP."
    - id: "NG-004"
      item: "Official District website replacement"
      reason: "Tracing Board has a distinct learning and engagement mission."
    - id: "NG-005"
      item: "Full LMS"
      reason: "Structured courses and certificates are outside MVP."
    - id: "NG-006"
      item: "Mobile app"
      reason: "Responsive web is sufficient for initial launch."
    - id: "NG-007"
      item: "Payment system"
      reason: "No paid membership model approved."
    - id: "NG-008"
      item: "Anonymous posting"
      reason: "Increases moderation and tone risk."
    - id: "NG-009"
      item: "Political discussion area"
      reason: "Distracts from Masonic learning purpose."
    - id: "NG-010"
      item: "Conspiracy discussion area"
      reason: "Damages credibility and attracts low-quality engagement."

requires_explicit_future_decision:
  - "Changing from Discourse to another community engine"
  - "Hosting production from Layer-8 Labs"
  - "Making Tracing Board an official District platform"
  - "Opening public posting without approval controls"
  - "Adding payments"
  - "Adding a custom member database"
  - "Adding private ritual-specific sections"
