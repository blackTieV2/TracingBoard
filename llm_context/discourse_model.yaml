schema_version: "1.0"
document_id: "tb-discourse-model"
phase: "TB-1"
last_updated: "2026-05-13"

community_domain: "community.tracingboard.org"
platform: "Discourse"

category_principles:
  - "Start simple."
  - "Categories are rooms; tags are shelves."
  - "Make questions visible."
  - "Committee spaces require owners."
  - "Protect tone early."

categories:
  - id: "announcements"
    name: "Announcements"
    purpose: "Editor-approved announcements about Tracing Board, launch notices, featured papers, and major updates."
    read_access: "public_or_members"
    create_topic_access: "staff_only"
    reply_access: "restricted"
  - id: "start-here"
    name: "Start Here"
    purpose: "Welcome, rules, how to post, how to ask questions, how to submit papers."
    read_access: "public_or_members"
    create_topic_access: "staff_only"
    reply_access: "restricted"
  - id: "papers-presentations"
    name: "Papers and Presentations"
    purpose: "Long-form papers, lodge talks, presentation notes, and associated discussions."
    read_access: "members_or_public_policy_dependent"
    create_topic_access: "approved_contributors_or_trusted_users"
    reply_access: "members"
    suggested_tags:
      - "paper"
      - "craft"
      - "royal-arch"
      - "symbolism"
      - "history"
      - "ritual"
  - id: "questions"
    name: "Questions from Brethren"
    purpose: "Sincere Masonic questions and Q&A-style discussion."
    read_access: "members"
    create_topic_access: "members_with_first_post_controls"
    reply_access: "members"
    special_rules:
      - "No ridicule of sincere questions."
      - "Encourage clear titles."
      - "Use solved/accepted answer if available."
  - id: "craft-masonry"
    name: "Craft Masonry"
    purpose: "General Craft education, symbolism, history, lodge learning, mentoring."
    read_access: "members"
    create_topic_access: "members"
    reply_access: "members"
  - id: "holy-royal-arch"
    name: "Holy Royal Arch"
    purpose: "Holy Royal Arch education, history, symbolism, questions, and chapter learning within proper boundaries."
    read_access: "members_or_restricted_if_required"
    create_topic_access: "members_or_approved_group"
    reply_access: "members_or_approved_group"
    boundary_note: "Avoid disclosure of material unsuitable for the audience."
  - id: "history-symbolism-allegory"
    name: "Masonic History, Symbolism, and Allegory"
    purpose: "Historical development, symbolic interpretation, allegorical readings, source criticism."
    read_access: "members"
    create_topic_access: "members"
    reply_access: "members"
    special_rules:
      - "Distinguish evidence, interpretation, tradition, allegory, and speculation."
  - id: "books-resources"
    name: "Book and Resource Recommendations"
    purpose: "Reliable Masonic reading and resource recommendations."
    read_access: "members"
    create_topic_access: "members"
    reply_access: "members"
  - id: "lodge-education-practice"
    name: "Lodge Education Practice"
    purpose: "Support Education Officers, Preceptors, mentors, and lodge leaders."
    read_access: "members"
    create_topic_access: "members"
    reply_access: "members"
  - id: "district-committees"
    name: "District Committees"
    purpose: "Controlled committee updates and learning-related committee materials."
    read_access: "members"
    create_topic_access: "committee_leads_or_staff"
    reply_access: "policy_dependent"
    future_subcategories:
      - "Education Committee"
      - "Preceptors"
      - "Membership"
      - "Charity"
      - "Communications"
      - "Royal Arch Education"
  - id: "site-help"
    name: "Site Help and Suggestions"
    purpose: "Login help, feature suggestions, bug reports, access questions."
    read_access: "members"
    create_topic_access: "members"
    reply_access: "members"
  - id: "moderation-admin"
    name: "Moderation and Admin"
    purpose: "Private staff operational category."
    read_access: "staff_only"
    create_topic_access: "staff_only"
    reply_access: "staff_only"

avoid_at_launch:
  - "One category per lodge"
  - "One category per committee without an owner"
  - "Marketplace"
  - "General politics"
  - "Conspiracy discussion"
  - "Memes/jokes"
  - "Anonymous posting"

trust_levels:
  new_user:
    controls:
      - "First post approval recommended"
      - "Limited links"
      - "Limited uploads"
  basic_user:
    capabilities:
      - "Reply"
      - "Create topics in open categories"
      - "Follow topics"
  regular_user:
    capabilities:
      - "Help answer questions"
      - "May be invited as contributor"
  approved_contributor:
    capabilities:
      - "Submit or post long-form content subject to editorial rules"
  moderator:
    capabilities:
      - "Handle flags"
      - "Move topics"
      - "Edit titles and tags"
      - "Enforce standards"
  admin:
    capabilities:
      - "System configuration"
      - "Users and groups"
      - "Categories"
      - "Plugins"
      - "Backups"
      - "Integrations"

launch_settings_recommended:
  - "Approve first post or first topic"
  - "Restrict new user uploads"
  - "Restrict new user links"
  - "Enable flagging"
  - "Create staff-only moderation category"
  - "Create moderator group"
  - "Create approved contributor group"
  - "Define category posting rights before soft launch"
